[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cityscope"
version = "0.1.0"
description = "Infrastructure Ontology Platform — From Observation to Understanding"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CONF", name = "Internal Use Only"}
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "python-hcl2>=5.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
cityscope = "src.registration.cli:main"
bootstrap = "src.bootstrap.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
