apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: sd-logmanagement-api
  name: Prod Sd Logmanagement Api
  domain: wincore-mssql
  team: nexus-backoffice
  description: Auto-bootstrapped from sd-logmanagement-api-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32722'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 8080
    description: api
  - name: grpc
    port: 8181
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Context' via WinCore__Identity__Authorization__ConnectionString
  - target: mssql-10-2-133-4
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Log' via WinCore__Data__SqlServerConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via WinCore__DomainEvents__RabbitMQ__HostName
  - target: identity-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-identity-service'
  image: logmanagement:9ddec47
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
