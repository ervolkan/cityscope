apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: identity-service
  name: Prod Identity Service
  domain: wincore-mssql
  team: wincore-identity
  description: Auto-bootstrapped from identity-service-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32701'
    external_traffic: 'true'
spec:
  type: service
  tier: 0
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'Identity' via NSWT__Data__ConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__DomainEvents__RabbitMQ__HostName
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: identity.openiddict:e506f30
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: SENTINEL
