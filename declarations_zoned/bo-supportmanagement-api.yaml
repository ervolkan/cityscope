apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: bo-supportmanagement-api
  name: Prod Bo Supportmanagement Api
  domain: wincore-mssql
  team: nexus-backoffice
  description: Auto-bootstrapped from bo-supportmanagement-api-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32718'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Support' via NSWT__Data__SqlServerConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__DomainEvents__RabbitMQ__HostName
  - target: srv-streamnet-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__StreamNet__GrpcHost
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  - target: identity-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-identity-service'
  image: supportmanagement:6437b3e
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
