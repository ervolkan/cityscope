apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betflow-service
  name: Prod Srv Betflow Service
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betflow-service-values.yaml
  labels:
    service_type: ClusterIP
spec:
  type: service
  tier: 3
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.BetTicket' via NSWT__Data__SqlServerConnectionString
  - target: srv-betdatahub-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__BetFlowApiOptions__BetDataHubGrpcGateWayHost
  - target: srv-betticket-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__BetFlowApiOptions__BetTicketGrpcGateWayHost
  - target: srv-customer-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__BetFlowApiOptions__CustomerGrpcServiceHost
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__BetDataRabbitMQ__HostName
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: betflow.service:latest
  scaling:
    current_replicas: 0
  nature: PROCESSOR
  sub_nature: WORKER
