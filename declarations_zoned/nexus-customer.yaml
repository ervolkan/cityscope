apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: nexus-customer
  name: Nexus Customer
  domain: app-postgres
  team: nexus-backend
  description: Auto-bootstrapped from nexus-customer-values.yaml
  labels:
    service_type: ClusterIP
spec:
  type: service
  tier: 3
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: http
  depends_on:
  - target: postgres-10-2-159-193
    type: storage
    protocol: postgres
    critical: true
    description: PostgreSQL 'nexus_customer' via ConnectionStrings__Default
  image: ghcr.io/betcorewin/nexus-customer:57165ed
  scaling:
    current_replicas: 3
    min_replicas: 3
    max_replicas: 9
    strategy: hpa
  nature: PROCESSOR
  sub_nature: WORKER
