apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betdataapi
  name: Prod Srv Betdataapi
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betdataapi-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32704'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Context' via NSWT__Identity__Authorization__ConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__BetDataRabbitMQ__HostName
  - target: prod-docdb
    type: storage
    protocol: mongodb
    critical: true
    description: DocumentDB via NSWT__Caching__Mongo
  - target: srv-parameters-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__ParamtersGrpcHost
  - target: srv-customer-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__CustomerGrpcHost
  - target: srv-branch-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__BranchGrpcHost
  - target: srv-betticket-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__BetPlaceGrpcHost
  - target: srv-streamnet-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__StreamNetGrpcHost
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: betdata.api:fadb26e
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
