apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betticket-api
  name: Prod Srv Betticket Api
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betticket-api-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32703'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Context' via NSWT__Identity__Authorization__ConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__BetDataRabbitMQ__HostName
  - target: prod-docdb
    type: storage
    protocol: mongodb
    critical: true
    description: DocumentDB via NSWT__Orleans__MongoStorage__ConnectionString
  - target: srv-customer-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__CustomerGrpcHost
  - target: identity-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__IdentityGrpcHost
  - target: bo-supportmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__SupportGrpcHost
  - target: srv-cashout-provider-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__CashoutProviderGrpcHost
  - target: srv-casino-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__CasinoGrpcHost
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: betticket.api:b26040a
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
