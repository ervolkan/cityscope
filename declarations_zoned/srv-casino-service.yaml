apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-casino-service
  name: Prod Srv Casino Service
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-casino-service-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32705'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Context' via NSWT__Identity__Authorization__ConnectionString
  - target: prod-docdb
    type: storage
    protocol: mongodb
    critical: true
    description: DocumentDB via NSWT__Orleans__MongoStorage__ConnectionString
  - target: srv-customer-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__CustomerGrpcHost
  - target: srv-branch-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__BranchGrpcHost
  - target: srv-streamnet-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__StreamNetGrpcHost
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__CAP__RabbitMQ__HostName
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  - target: identity-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-identity-service'
  image: casino.service:d523e70
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
