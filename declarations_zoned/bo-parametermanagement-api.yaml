apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: bo-parametermanagement-api
  name: Prod Bo Parametermanagement Api
  domain: wincore-mssql
  team: nexus-backoffice
  description: Auto-bootstrapped from bo-parametermanagement-api-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32717'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.BO.Parameters' via NSWT__Data__SqlServerConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__DomainEvents__RabbitMQ__HostName
  - target: identity-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-identity-service'
  image: parametermanagement:504eda1
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
