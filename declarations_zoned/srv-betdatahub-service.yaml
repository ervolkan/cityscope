apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betdatahub-service
  name: Prod Srv Betdatahub Service
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betdatahub-service-values.yaml
  labels:
    orleans: 'true'
    service_type: NodePort
    nodePort: '32709'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: orleans
    port: 11111
    description: orleans-silo
  - name: orleans
    port: 30000
    description: orleans-gw
  - name: grpc
    port: 8080
    description: grpc
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8181
    description: grpc-alt
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Context' via NSWT__Identity__Authorization__ConnectionString
  - target: srv-betdatahub-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__GrpcService__BetDataHubGrpcHost
  - target: srv-streamnet-service
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__GrpcService__StreamNetSiloGrpcHost
  - target: prod-docdb
    type: storage
    protocol: mongodb
    critical: true
    description: DocumentDB via NSWT__Orleans__MongoStorage__ConnectionString
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: betdata.hub.service:5b2ac18
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
