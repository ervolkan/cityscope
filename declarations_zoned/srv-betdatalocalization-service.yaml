apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betdatalocalization-service
  name: Prod Srv Betdatalocalization Service
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betdatalocalization-service-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32708'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.BetData.Source' via NSWT__Data__SqlServerConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__BetDataRabbitMQ__HostName
  - target: identity-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-identity-service'
  image: betdata.localization.service:a46717f
  scaling:
    current_replicas: 0
  nature: PROCESSOR
  sub_nature: REACTOR
