apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: nexus-bonus
  name: Nexus Bonus
  domain: app-postgres
  team: nexus-backend
  description: Auto-bootstrapped from nexus-bonus-values.yaml
  labels:
    service_type: ClusterIP
spec:
  type: service
  tier: 3
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: http
  depends_on:
  - target: postgres-10-2-159-193
    type: storage
    protocol: postgres
    critical: true
    description: PostgreSQL 'nexus_bonus' via ConnectionStrings__Default
  image: ghcr.io/betcorewin/nexus-bonus:5ac6e63
  scaling:
    current_replicas: 2
    min_replicas: 2
    max_replicas: 6
    strategy: hpa
  nature: PROCESSOR
  sub_nature: WORKER
