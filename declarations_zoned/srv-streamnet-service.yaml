apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-streamnet-service
  name: Prod Srv Streamnet Service
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-streamnet-service-values.yaml
  labels:
    orleans: 'true'
    service_type: NodePort
    nodePort: '32706'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: orleans
    port: 11111
    description: orleans-silo
  - name: orleans
    port: 30000
    description: orleans-gw
  - name: grpc
    port: 8080
    description: grpc
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8181
    description: grpc-alt
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Customers' via NSWT__Data__SqlServerConnectionString
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__DomainEvents__RabbitMQ__HostName
  - target: srv-parameters-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__ParamtersGrpcHost
  image: streamnet.simple:9316a66
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: REACTOR
