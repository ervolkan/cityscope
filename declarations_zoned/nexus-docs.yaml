apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: nexus-docs
  name: Nexus Docs
  domain: app-postgres
  team: nexus-backend
  description: Auto-bootstrapped from nexus-docs-values.yaml
  labels:
    service_type: ClusterIP
spec:
  type: service
  tier: 3
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: http
  depends_on:
  - target: postgres-10-2-159-193
    type: storage
    protocol: postgres
    critical: true
    description: PostgreSQL 'nexus_docs' via ConnectionStrings__Default
  image: ghcr.io/betcorewin/nexus-docs:5ac6e63
  scaling:
    current_replicas: 1
    min_replicas: 1
    max_replicas: 3
    strategy: hpa
  nature: PROCESSOR
  sub_nature: WORKER
