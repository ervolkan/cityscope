apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-customer-grpc
  name: Prod Srv Customer Grpc
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-customer-grpc-values.yaml
  labels:
    service_type: ClusterIP
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  - name: grpc
    port: 8080
    description: grpc
  depends_on:
  - target: mssql-10-2-152-240
    type: storage
    protocol: mssql
    critical: true
    description: MSSQL 'NSWT.Customer' via NSWT__Data__SqlServerConnectionString
  - target: sd-logmanagement-api
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Logger__LogCenterGrpcHost
  image: customer.grpc.service:9eaff15
  scaling:
    current_replicas: 1
  nature: PROCESSOR
  sub_nature: WORKER
