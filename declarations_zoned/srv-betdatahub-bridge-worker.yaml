apiVersion: cityscope.dev/v1
kind: Entity
metadata:
  id: srv-betdatahub-bridge-worker
  name: Prod Srv Betdatahub Bridge Worker
  domain: wincore-mssql
  team: wincore-backend
  description: Auto-bootstrapped from srv-betdatahubbridge-worker-values.yaml
  labels:
    service_type: NodePort
    nodePort: '32710'
    external_traffic: 'true'
spec:
  type: service
  tier: 1
  lifecycle: active
  protocols:
  - name: http
    port: 80
    description: api
  depends_on:
  - target: prod-docdb
    type: storage
    protocol: mongodb
    critical: true
    description: DocumentDB via NSWT__Orleans__MongoStorage__ConnectionString
  - target: srv-betdatahub-grpc
    type: sync
    protocol: grpc
    critical: false
    description: from NSWT__Grpc__BetDataHubGrpcHost
  - target: rabbitmq-10-2-160-192
    type: async
    protocol: amqp
    critical: false
    description: RabbitMQ via NSWT__BetDataRabbitMQ__HostName
  - target: srv-betdatahub-service
    type: sync
    protocol: http
    critical: true
    description: 'initContainer: prod-srv-betdatahub-service'
  image: betdata.hubbridge:0089793
  scaling:
    current_replicas: 0
  nature: PROCESSOR
  sub_nature: REACTOR
