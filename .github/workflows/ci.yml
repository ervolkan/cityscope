name: CityScope CI

on:
  push:
    branches: [main]
    paths:
      - "declarations/**"
      - "src/ontology/**"
      - "src/registration/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "declarations/**"
      - "src/ontology/**"
      - "src/registration/**"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check src/
          ruff format --check src/

      - name: Type check
        run: mypy src/

      - name: Validate ontology schema
        run: python -m src.registration validate --schema src/ontology/ontology-schema.json --declarations declarations/

      - name: Generate diff report
        if: github.event_name == 'pull_request'
        run: python -m src.registration diff --base main --pr --output diff-report.md

      - name: Consolidate ontology
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m src.registration consolidate --output ontology.json

      - name: Upload ontology.json
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ontology
          path: ontology.json
          retention-days: 90
